# DOSBox-X config: Super Solvers Gizmos & Gadgets! (DOS v1.0, SSG.EXE) reference environment.
# Used by: python -P tools/tmctl.py start --profile gg [--args "-sb"] [--fresh] --park
# C: is a writable COPY of GG_DATA (default GadgetsAndGizmos; extracted\gg_c, game in C:\GG) because
# the game writes PLAYERS.DAT and its screen swap file GIZMO004.DAT. Never mount the original.
# tmctl writes C:\MOUSEKEY.COM and C:\RUN.BAT (date/time, C:\CLOCK.TXT, MOUSEKEY, cd \GG,
# SSG <args>) before every start.
# Rationale for every choice: re/gg/docs/REFERENCE_CAPTURES.md section 1.
[sdl]
# start off-screen (parked); tmctl.py also re-parks after guest video-mode switches
windowposition=-4000,100
output=opengl
# mode 13h at 2x2 (screenshots and AVIs are internal captures and do not depend on the window)
windowresolution=640x400
showmenu=true
# Guest mouse input does NOT come from the host: the MOUSEKEY TSR (tools/gg/mouse_tsr.py, loaded by
# C:\RUN.BAT) takes over the game's INT 33h event handler and is driven by posted keys
# (tmctl.py mouse ...). This SDL1 build cannot be given a mouse position by posted messages (it
# reads GetCursorPos), so tmctl never posts mouse messages. As a safeguard nothing may capture the
# host pointer anyway: autolock=false (a click would otherwise capture it, i.e. ClipCursor to a
# window parked off-screen) and middle_unlock=none.
autolock=false
middle_unlock=none
mouse_emulation=never
usesystemcursor=false

[dosbox]
# vgaonly = plain IBM VGA: mode 13h, DAC, 70 Hz retrace, display combination code 8. The game
# needs nothing more (no VESA, no SVGA registers) and refuses anything less than MCGA.
machine=vgaonly
memsize=16
captures=C:\Git\TM\extracted\captures
saveremark=false
forceloadstate=true
show recorded filename=false

[render]
aspect=false
scaler=none

[cpu]
# The game needs a 286 and checks the CPU class (Cpu_Detect 2c08:0032): a 286 takes a slow-machine
# path (2a80:07b1), a 386 or better does not (3 and 4 are treated alike). 486 = a typical 1993 PC.
# Fixed cycles make the emulated speed independent of the host. The game paces its loops by PIT
# deadlines (4 ticks = 27.5 ms per frame), so the CPU only has to be fast enough for a frame's
# work to fit; 26800 is about a 486DX2-66 in DOSBox terms.
core=normal
cputype=486
cycles=fixed 26800

[mixer]
# Devices are still emulated (the game detects them) but nothing plays on the host speakers:
# the user works on this PC while the emulator runs parked off-screen.
# The mixer still renders into captures (tmctl.py audio wav|opl|mtavi, and the AVIs of rec).
nosound=true

[sblaster]
# Sound Blaster 2.0 = an OPL2 (YM3812) at 220h and 388h. The game only drives an OPL2-compatible
# chip at 388h (-sa/-sb/-sm all mean that) and has no digitised sound; an OPL2 (not the OPL3 of an
# SB16) is exactly what it was written for and what the engine's YM3812 emulation reproduces.
sbtype=sb2
sbbase=220
irq=7
dma=1
oplmode=opl2

[speaker]
pcspeaker=true
tandy=off

[dos]
xms=true
ems=false
# The built-in INT 33h driver (the game refuses to start without a mouse driver).
int33=true

[autoexec]
mount c "C:\Git\TM\extracted\gg_c"
c:
cd \
call RUN.BAT
