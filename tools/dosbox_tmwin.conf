# DOSBox-X config: Windows 3.1 + Treasure Mountain (Win CD) reference environment.
# C: is a working COPY of TM-WIN\SSTM3x (extracted\win31_c); the CD image is mounted read-only.
[sdl]
# start off-screen (parked); tmctl.py also re-parks after guest video-mode switches
windowposition=-4000,100
output=opengl
windowresolution=1280x960
autolock=true
showmenu=true

[dosbox]
machine=svga_s3
memsize=32
captures=C:\Git\TM\extracted\captures
saveremark=false
forceloadstate=true

[render]
aspect=false
scaler=none

[cpu]
core=normal
cputype=pentium
cycles=fixed 60000

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5

[midi]
mpu401=intelligent
mididevice=win32

[dos]
xms=true
ems=true

[autoexec]
mount c "C:\Git\TM\extracted\win31_c"
imgmount d "C:\Git\TM\TM-WIN\SSTM3x\CD\cd.cue"
set BLASTER=A220 I7 D1 H5 P330 T6
set SOUND=C:\SB16
set PATH=C:\WINDOWS;Z:\
set TEMP=C:\WINDOWS\TEMP
c:
cd \
win d:\tmtwincd\tmtwincd.exe
