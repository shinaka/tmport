# DOSBox-X config: Treasure Mountain! 1990 DOS edition (SST.EXE) reference environment.
# Used by: python -P tools/tmctl.py start --profile dos [--machine ega|tandy|...] [--args "-E"]
# C: is a writable COPY of TM-DOS (extracted\dos_c, game in C:\TM) because the game writes
# USERS.DAT. Never mount TM-DOS itself. tmctl writes C:\RUN.BAT (cd \TM + SST <args>) before
# every start; machine= below is the default and tmctl overrides it with -set machine=...
[sdl]
# start off-screen (parked); tmctl.py also re-parks after guest video-mode switches
windowposition=-4000,100
output=opengl
windowresolution=1280x960
autolock=true
showmenu=true

[dosbox]
# ega = IBM EGA (game auto-detects EGA, video type 1); tandy = Tandy 1000 (video type 3)
machine=ega
memsize=16
captures=C:\Git\TM\extracted\captures
saveremark=false
forceloadstate=true
show recorded filename=false

[render]
aspect=false
scaler=none

[cpu]
# The game reprograms the PIT (1000:03c5) and paces itself from the timer, so the CPU speed
# only has to be fast enough; 286-class speed is plenty.
core=normal
cputype=auto
cycles=fixed 6000

[mixer]
# Devices are still emulated (the game detects them) but nothing plays on the host speakers:
# the user works on this PC while the emulator runs parked off-screen.
nosound=true

[sblaster]
# SB16 includes an OPL2/OPL3, so the game's AdLib probe (4ac9:0d0f) finds an AdLib (sound type 2).
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5

[speaker]
# Tandy sound only when machine=tandy (the game then picks sound type 1)
tandy=auto

[dos]
xms=true
ems=true

[autoexec]
mount c "C:\Git\TM\extracted\dos_c"
c:
cd \
call RUN.BAT
